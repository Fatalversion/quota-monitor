[package]
name = "quota-monitor"
version = "0.1.0"
description = "Desktop shell for quota-monitor: an edge strip and a tray popover over the quota CLI."
authors = ["quota-monitor contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

# One binary. `main.rs` is the whole entry point; everything else is a module.
[[bin]]
name = "quota-monitor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` is what puts an icon in the notification area; without it the
# tray popover mode cannot exist.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml is unmaintained; _ng is the maintained fork. Used for one thing
# only: reading widget.mode out of the same config file the CLI reads.
serde_yaml_ng = "0.10"

# The system theme is a Windows question, so its dependency is too. It is
# already in the tree as a transitive dependency of tauri, so naming it here
# adds no download and no new code to audit.
[target.'cfg(windows)'.dependencies]
# Read-only HKCU access for the accent and the dark-mode flag. Only
# `open_subkey_with_flags(.., KEY_READ)` is ever used; nothing in this crate
# opens a key for writing.
#
# No window-vibrancy and no windows-version: the widget applies no mica and no
# acrylic at all, and theme.rs's effects section records why.
winreg = "0.55"

[features]
# The asset protocol that serves ../ui out of the binary. Kept in `default` so
# a plain `cargo build --release` produces a working app rather than one that
# expects a dev server this project does not have.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
